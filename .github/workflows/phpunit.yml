name: PHPUnit Tests

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main, dev ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: phpunit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  phpunit_matrix:
    name: phpunit (${{ matrix.stack }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - stack: legacy
            config: .wp-env.legacy.json
          - stack: current
            config: .wp-env.current.json
          - stack: current-php85
            config: .wp-env.current.json
            php: '8.5'

    env:
      WP_ENV_CONFIG: ${{ matrix.config }}
      WP_ENV_PHP_VERSION: ${{ matrix.php || '' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24.22.2'
          cache: 'npm'
          cache-dependency-path: dianxiaomi/package-lock.json

      - name: Validate metadata and read expected compatibility versions
        env:
          STACK: ${{ matrix.stack }}
        run: |
          node ../scripts/check-compatibility.mjs "$WP_ENV_CONFIG" >> "$GITHUB_ENV"
          echo "WP_ENV_HOME=${WP_ENV_HOME:-$RUNNER_TEMP/wp-env}-$STACK" >> "$GITHUB_ENV"
        working-directory: dianxiaomi

      - name: Set up PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: '8.1'
          tools: composer:v2
          coverage: none

      - name: Validate composer.json against composer.lock
        run: composer validate --strict --no-check-publish
        working-directory: dianxiaomi

      - name: Get composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"
        working-directory: dianxiaomi

      - name: Cache Composer dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('dianxiaomi/composer.lock', 'dianxiaomi/composer.json') }}
          restore-keys: |
            ${{ runner.os }}-composer-

      - name: Install Composer dependencies
        run: composer install --prefer-dist --no-progress --no-interaction
        working-directory: dianxiaomi

      - name: Check platform requirements
        run: composer check-platform-reqs
        working-directory: dianxiaomi

      - name: Install npm dependencies
        run: npm ci --engine-strict
        working-directory: dianxiaomi

      - name: Audit development dependencies
        run: |
          composer audit --locked
          npm audit
        working-directory: dianxiaomi

      - name: Start wp-env with retry
        id: wp-env
        run: |
          for attempt in 1 2 3; do
            if npx --no-install wp-env start --config="$WP_ENV_CONFIG"; then
              exit 0
            fi

            npx --no-install wp-env stop --config="$WP_ENV_CONFIG" || true

            if [ "$attempt" -eq 3 ]; then
              echo "wp-env failed to start after $attempt attempts"
              exit 1
            fi

            sleep $((attempt * 15))
          done
        working-directory: dianxiaomi

      - name: Verify compatibility stack
        run: |
          set -euo pipefail

          PHP_VERSION="$(npx --no-install wp-env run cli --config="$WP_ENV_CONFIG" php -r 'echo PHP_MAJOR_VERSION . "." . PHP_MINOR_VERSION;')"
          WORDPRESS_VERSION="$(npx --no-install wp-env run cli --config="$WP_ENV_CONFIG" wp core version)"
          WOOCOMMERCE_VERSION="$(npx --no-install wp-env run cli --config="$WP_ENV_CONFIG" wp plugin get woocommerce --field=version)"

          printf '%s\n' "$PHP_VERSION"
          printf '%s\n' "$WORDPRESS_VERSION"
          printf '%s\n' "$WOOCOMMERCE_VERSION"

          grep -Fxq "$EXPECTED_PHP" <<< "$PHP_VERSION"
          grep -Fxq "$EXPECTED_WORDPRESS" <<< "$WORDPRESS_VERSION"
          grep -Fxq "$EXPECTED_WOOCOMMERCE" <<< "$WOOCOMMERCE_VERSION"

          npx --no-install wp-env run cli --config="$WP_ENV_CONFIG" wp plugin is-active woocommerce
          npx --no-install wp-env run cli --config="$WP_ENV_CONFIG" wp plugin is-active dianxiaomi
        working-directory: dianxiaomi

      - name: Run JavaScript regression tests
        run: npm run test:js
        working-directory: dianxiaomi

      - name: Run PHPUnit tests
        run: npx --no-install wp-env run cli --config="$WP_ENV_CONFIG" --env-cwd=wp-content/plugins/dianxiaomi vendor/bin/phpunit
        working-directory: dianxiaomi

      - name: Stop wp-env
        if: always() && steps.wp-env.outcome != 'skipped'
        run: npx --no-install wp-env stop --config="$WP_ENV_CONFIG"
        working-directory: dianxiaomi

  phpunit:
    name: phpunit
    if: always()
    needs: phpunit_matrix
    runs-on: ubuntu-latest
    steps:
      - name: Verify PHPUnit matrix
        env:
          MATRIX_RESULT: ${{ needs.phpunit_matrix.result }}
        run: test "$MATRIX_RESULT" = "success"
