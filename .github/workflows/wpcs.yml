name: WPCS check

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main, dev ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wpcs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  wpcs_matrix:
    name: phpcs (${{ matrix.php-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php-version: ['8.1', '8.2', '8.3', '8.4', '8.5']

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: ${{ matrix.php-version }}
          tools: composer:v2

      - name: Get composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"
        working-directory: dianxiaomi

      - name: Cache dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-php-${{ matrix.php-version }}-composer-${{ hashFiles('dianxiaomi/composer.lock', 'dianxiaomi/composer.json') }}
          restore-keys: |
            ${{ runner.os }}-php-${{ matrix.php-version }}-composer-

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress --no-interaction
        working-directory: dianxiaomi

      - name: Check platform requirements
        run: composer check-platform-reqs
        working-directory: dianxiaomi

      - name: Run PHPCS
        run: composer phpcs
        working-directory: dianxiaomi

  wpcs:
    name: wpcs
    if: always()
    needs: wpcs_matrix
    runs-on: ubuntu-latest
    steps:
      - name: Verify WPCS matrix
        env:
          MATRIX_RESULT: ${{ needs.wpcs_matrix.result }}
        run: test "$MATRIX_RESULT" = "success"
