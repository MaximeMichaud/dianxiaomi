name: Psalm

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main, dev ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: psalm-${{ github.ref }}
  cancel-in-progress: true

jobs:
  psalm_matrix:
    name: psalm (${{ matrix.php-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php-version: ['8.1', '8.2', '8.3', '8.4', '8.5']

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: ${{ matrix.php-version }}
          tools: composer:v2

      - name: Validate composer.json against composer.lock
        run: composer validate --strict --no-check-publish
        working-directory: dianxiaomi

      - name: Get composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"
        working-directory: dianxiaomi

      - name: Cache dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-php-${{ matrix.php-version }}-composer-${{ hashFiles('dianxiaomi/composer.lock', 'dianxiaomi/composer.json') }}
          restore-keys: |
            ${{ runner.os }}-php-${{ matrix.php-version }}-composer-

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress --no-interaction
        working-directory: dianxiaomi

      - name: Check platform requirements
        run: composer check-platform-reqs
        working-directory: dianxiaomi

      - name: Run Psalm
        run: composer psalm
        working-directory: dianxiaomi

  psalm:
    name: psalm
    if: always()
    needs: psalm_matrix
    runs-on: ubuntu-latest
    steps:
      - name: Verify Psalm matrix
        env:
          MATRIX_RESULT: ${{ needs.psalm_matrix.result }}
        run: test "$MATRIX_RESULT" = "success"
